name: Build BMW Speed Camera Warning

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Speed Camera Warning version"
        required: true
        default: "0.7.0"
      refresh_data:
        description: "Force refresh camera and OSM data"
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "17 3 * * 1"
  push:
    branches: [main]
    paths:
      - "bmw-speed-camera-warning/**"
      - ".github/workflows/speed-camera-release.yml"

permissions:
  contents: write

concurrency:
  group: speed-camera-warning-release
  cancel-in-progress: true

jobs:
  build-release:
    runs-on: ubuntu-latest
    env:
      APP_VERSION: ${{ inputs.version || '0.7.0' }}
      APP_ID: aurelm_speed_camera_warning
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: aurelmarius/bmw-games
          path: upstream

      - name: Restore generated camera and map data cache
        id: data_cache
        uses: actions/cache/restore@v4
        with:
          path: |
            bmw-speed-camera-warning/data/camera-db.json
            bmw-speed-camera-warning/data/mari_el_republic.osm.pbf
            bmw-speed-camera-warning/apps/aurelm_speed_camera_warning/camera-db.json
            bmw-speed-camera-warning/apps/aurelm_speed_camera_warning/road-zones.json
            bmw-speed-camera-warning/apps/aurelm_speed_camera_warning/city-map.json
          key: speed-camera-data-v1-${{ github.run_id }}
          restore-keys: |
            speed-camera-data-v1-

      - name: Import regional camera sources
        if: inputs.refresh_data == true || github.event_name == 'schedule'
        run: |
          python3 bmw-speed-camera-warning/tools/import_camera_sources.py
          # Imported databases are consumed directly by this build.
          # Do not push generated data from the runner: concurrent builds can race
          # and create rebase conflicts in camera-db.json.

      - name: Install OSM PBF parser
        if: steps.data_cache.outputs.cache-hit != 'true' || inputs.refresh_data == true || github.event_name == 'schedule'
        run: python3 -m pip install --break-system-packages osmium

      - name: Import offline camera road geometry
        if: steps.data_cache.outputs.cache-hit != 'true' || inputs.refresh_data == true || github.event_name == 'schedule'
        run: |
          python3 bmw-speed-camera-warning/tools/import_road_zones.py
          # Generated geometry is included in the release without committing from CI.

      - name: Import offline Yoshkar-Ola street geometry
        if: steps.data_cache.outputs.cache-hit != 'true' || inputs.refresh_data == true || github.event_name == 'schedule'
        run: |
          python3 bmw-speed-camera-warning/tools/import_city_roads.py
          # Generated geometry is included in the release without committing from CI.

      - name: Save generated camera and map data cache
        if: steps.data_cache.outputs.cache-hit != 'true' || inputs.refresh_data == true || github.event_name == 'schedule'
        uses: actions/cache/save@v4
        with:
          path: |
            bmw-speed-camera-warning/data/camera-db.json
            bmw-speed-camera-warning/data/mari_el_republic.osm.pbf
            bmw-speed-camera-warning/apps/aurelm_speed_camera_warning/camera-db.json
            bmw-speed-camera-warning/apps/aurelm_speed_camera_warning/road-zones.json
            bmw-speed-camera-warning/apps/aurelm_speed_camera_warning/city-map.json
          key: speed-camera-data-v1-${{ github.run_id }}

      - name: Prepare standalone app
        run: |
          mkdir -p upstream/apps/${APP_ID}
          cp -a bmw-speed-camera-warning/apps/${APP_ID}/. upstream/apps/${APP_ID}/
          python3 - <<'PY'
          import json, os
          p=f"upstream/apps/{os.environ['APP_ID']}/app.json"
          d=json.load(open(p,encoding='utf-8'))
          d['version']=os.environ['APP_VERSION']
          json.dump(d,open(p,'w',encoding='utf-8'),ensure_ascii=False,indent=2)
          PY

      - name: Generate Cyrillic font atlases
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-ubuntu python3-pil
          python3 - <<'PY'
          p='upstream/kit/tools/bake_fonts.py'
          s=open(p,encoding='utf-8').read()
          old="TEXT = ''.join(chr(c) for c in range(32, 127)) + '°μ│·–—…×±²³€↑↓→←✓✕'"
          extra='АБВГДЕЁЖЗИЙКЛМНОПРСТУФХЦЧШЩЪЫЬЭЮЯабвгдеёжзийклмнопрстуфхцчшщъыьэюя'
          new=old + " + '" + extra + "'"
          if old not in s:
              raise SystemExit('Could not locate the standard font charset declaration')
          open(p,'w',encoding='utf-8').write(s.replace(old,new,1))
          PY
          cd upstream
          python3 kit/tools/bake_fonts.py
          cd ..

      - name: Validate and build
        run: |
          node --check upstream/apps/${APP_ID}/main.js
          node --check upstream/apps/${APP_ID}/gps.js
          node --check upstream/apps/${APP_ID}/camera-store.js
          node --check upstream/apps/${APP_ID}/proximity.js
          node --check upstream/apps/${APP_ID}/road-guidance.js
          node bmw-speed-camera-warning/tests/readout-config.test.js
          node bmw-speed-camera-warning/tests/road-guidance.test.js
          python3 -m py_compile bmw-speed-camera-warning/tools/import_road_zones.py
          test -s upstream/apps/${APP_ID}/road-zones.json
          test -f upstream/apps/${APP_ID}/city-map.json
          # Run in high-priority background to receive BMW GPS events behind native navigation.
          python3 - <<'PY'
          p='upstream/kit/tools/build.py'
          s=open(p,encoding='utf-8').read()
          old="'priority': 'PRIO_LOW',\n            'visibility': 'FOREGROUND', 'latencyClass': 'FOREGROUND', 'loggingId': spec['loggingId'],\n            'userLoginRequired': False, 'backgroundPriority': 200, 'someipManifest': 'manifest.json',"
          new="'priority': 'PRIO_HIGHEST',\n            'visibility': 'BACKGROUND', 'latencyClass': 'HIGH_PRIO_BACKGROUND', 'loggingId': spec['loggingId'],\n            'userLoginRequired': False, 'backgroundPriority': 50, 'someipManifest': 'manifest.json',"
          if old not in s:
              raise SystemExit('Could not find expected OAP app settings in upstream build.py')
          open(p,'w',encoding='utf-8').write(s.replace(old,new,1))
          PY
          cd upstream
          python3 kit/tools/build.py "${APP_ID}"
          mkdir -p ../release
          cp "dist/${APP_ID}@${APP_VERSION}.tgz" ../release/
          cp "dist/${APP_ID}@${APP_VERSION}.mgu" ../release/

      - name: Validate MGU Store release layout
        run: |
          test -s "release/${APP_ID}@${APP_VERSION}.tgz"
          test -s "release/${APP_ID}@${APP_VERSION}.mgu"
          python3 - <<'PY'
          import json, os
          p=f"bmw-speed-camera-warning/apps/{os.environ['APP_ID']}/app.json"
          d=json.load(open(p,encoding='utf-8'))
          if d.get('id') != os.environ['APP_ID']:
              raise SystemExit('app.json id does not match APP_ID')
          if not os.environ['APP_ID'].startswith('aurelm_'):
              raise SystemExit('MGU app id must have a unique vendor prefix')
          PY

      - name: Publish standalone app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${APP_ID}@${APP_VERSION}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              "release/${APP_ID}@${APP_VERSION}.tgz" \
              "release/${APP_ID}@${APP_VERSION}.mgu" \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" \
              "release/${APP_ID}@${APP_VERSION}.tgz" \
              "release/${APP_ID}@${APP_VERSION}.mgu" \
              --repo "$GITHUB_REPOSITORY" \
              --title "BMW Speed Camera Warning ${APP_VERSION}" \
              --notes "Standalone offline BMW MGU ID7 speed camera database; road-geometry-matched camera-ahead warnings only; GPS accuracy must be <=15 m; no nearby fallback, no OSM road speed limits, camera-record speed limits only. No OSM road speed-limit detection. Voice output disabled."
          fi
